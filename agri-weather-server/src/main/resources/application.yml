server:
  port: 8082
  tomcat:
    # 默认只吞 2MB；超限上传会直接断连接，前端拿不到 413 JSON。
    # 放开后由 MaxUploadSizeExceededException 统一回 413。
    max-swallow-size: -1

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agri_weather?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 表结构由 Flyway 管理，Hibernate 不再自动改表
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 全新库由 sql/schema.sql + sql/seed-current.sql 初始化到 V9；
    # 老库没有 flyway_schema_history 时以此为基线，不重复执行 V1-V9
    baseline-on-migrate: true
    baseline-version: 9

  # 上传兜底上限：录音最长 15MB；图片/知识库/对话文档仍由各接口按 5MB 校验
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  # SSE 流式智能体的异步请求超时（思考 + 多轮工具可能较久）
  mvc:
    async:
      request-timeout: 200000

  # Redis：天气缓存，多个实例共享同一份
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

# JWT
app:
  jwt:
    secret: YWdyaS13ZWF0aGVyLXNlY3JldC1rZXktMjAyNi1zbWFydC1mYXJtaW5nLXBsYXRmb3Jt
    # access token 2 小时；refresh token 由 /api/auth/refresh 轮换，默认 30 天
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}

  # 农事智能体（DeepSeek）
  # API Key 用环境变量注入，不要写在本文件里：set DEEPSEEK_API_KEY=sk-xxx
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-reasoner}
    max-iterations: 6
    timeout-seconds: 120
    temperature: 0.3
    max-tokens: 4096

  # 作物照片识别（多模态）
  # 默认复用 DeepSeek Key 与地址；可单独配置 VISION_API_KEY / VISION_BASE_URL
  vision:
    api-key: ${VISION_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: ${VISION_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}
    model: ${VISION_MODEL:deepseek-v4-flash-vision-exp}
    timeout-seconds: 120
    max-tokens: 3000
    max-images: 3
    max-image-bytes: 5242880

  # 知识库向量检索（OpenAI 兼容 /embeddings）
  # 不配置时使用本地字词哈希向量；配置后可接 BGE / M3E / OpenAI 等兼容服务
  embedding:
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
    batch-size: ${EMBEDDING_BATCH_SIZE:16}

  # 语音识别（OpenAI 兼容 /audio/transcriptions；讯飞/阿里可加适配层或使用浏览器语音回退）
  asr:
    base-url: ${ASR_BASE_URL:}
    api-key: ${ASR_API_KEY:}
    model: ${ASR_MODEL:whisper-1}
    language: ${ASR_LANGUAGE:zh}
    timeout-seconds: ${ASR_TIMEOUT_SECONDS:60}

  # 每日 AI 额度（与每分钟限流互补）
  ai:
    quota-enabled: ${AI_QUOTA_ENABLED:true}
    daily-chat-quota: ${AI_DAILY_CHAT_QUOTA:80}

# 按分钟限流：登录爆破 / AI 调用被刷 / 上传滥用
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    agent-per-minute: ${RATE_LIMIT_AGENT_PER_MINUTE:10}
    upload-per-minute: ${RATE_LIMIT_UPLOAD_PER_MINUTE:6}

# 对话内文档检索：上传切块建索引，提问时只注入相关片段
  document:
    ttl-days: ${DOCUMENT_TTL_DAYS:7}
    max-chunks: ${DOCUMENT_MAX_CHUNKS:120}
    top-k: ${DOCUMENT_TOP_K:4}
    max-block-chars: ${DOCUMENT_MAX_BLOCK_CHARS:2400}

  # Web Push（VAPID；不配置时关闭后台推送，不影响站内通知）
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@example.com}

  # 后台定时生成地块预警（多实例用 Redis 锁互斥）
  alerts:
    refresh-initial-delay-ms: ${ALERT_REFRESH_INITIAL_DELAY_MS:120000}
    refresh-interval-ms: ${ALERT_REFRESH_INTERVAL_MS:1800000}

  # 天气外呼与缓存
  weather:
    base-url: ${WEATHER_BASE_URL:https://api.open-meteo.com}
    # 国内备源：配置和风天气 Key 后，Open-Meteo 失败自动降级
    fallback-base-url: ${QWEATHER_BASE_URL:https://devapi.qweather.com}
    fallback-api-key: ${QWEATHER_API_KEY:}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    cache-enabled: ${WEATHER_CACHE_ENABLED:true}
    fresh-ttl-seconds: 1800      # 30 分钟内直接命中
    stale-ttl-seconds: 86400     # 超过 30 分钟仍可兜底，也是 Redis 中的实际 TTL
    grid-decimals: 3             # 缓存坐标精度，3 位小数约 110 米
    forecast-days: 7
    # 定时预取：多实例下由 Redis 锁保证每轮只有一个实例执行
    prefetch-enabled: true
    prefetch-interval-ms: 1200000      # 20 分钟
    prefetch-initial-delay-ms: 60000   # 启动后 1 分钟首跑
    prefetch-max-coords: 200
    prefetch-spacing-ms: 250

# 仅暴露健康检查，供负载均衡探活
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Redis 故障时应用会降级直连上游，不应因此被判为不可用而下线
    redis:
      enabled: false
