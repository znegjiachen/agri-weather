name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agri-weather-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw -q test

  fresh-db:
    name: Fresh MySQL (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # schema-seed：按部署文档用 schema.sql + seed-current.sql 初始化，再以 V10 为基线启动
        # flyway-only：空库从 V1 跑到 V10，验证迁移链本身
        mode: [schema-seed, flyway-only]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agri_weather
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/agri_weather?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FLYWAY_ENABLED: 'true'
      AI_QUOTA_ENABLED: 'false'
      RATE_LIMIT_ENABLED: 'false'
      WEATHER_CACHE_ENABLED: 'false'
      ALERT_REFRESH_INITIAL_DELAY_MS: '3600000'
    defaults:
      run:
        working-directory: agri-weather-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install MySQL client if missing
        run: command -v mysql >/dev/null || (sudo apt-get update && sudo apt-get install -y mysql-client)

      - name: Initialize with schema.sql + seed-current.sql
        if: matrix.mode == 'schema-seed'
        run: |
          mysql -h127.0.0.1 -uroot -proot < sql/schema.sql
          mysql -h127.0.0.1 -uroot -proot agri_weather < sql/seed-current.sql
          mysql -h127.0.0.1 -uroot -proot agri_weather -e \
            "SELECT COUNT(*) AS crops FROM crop_info; SELECT COUNT(*) AS pests FROM pest_knowledge;"

      - name: Create empty database for Flyway chain
        if: matrix.mode == 'flyway-only'
        run: |
          mysql -h127.0.0.1 -uroot -proot -e \
            "DROP DATABASE IF EXISTS agri_weather; CREATE DATABASE agri_weather CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Start backend, run Flyway and Hibernate validate
        run: |
          set -euo pipefail
          ./mvnw -q -DskipTests spring-boot:run > /tmp/backend.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          healthy=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8082/actuator/health > /tmp/health.json 2>/dev/null; then
              healthy=1
              echo "backend healthy after $((i * 2))s"
              cat /tmp/health.json
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "backend process exited before becoming healthy"
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            echo "---- backend log ----"
            tail -n 300 /tmp/backend.log
            exit 1
          fi

          echo "---- flyway history ----"
          mysql -h127.0.0.1 -uroot -proot agri_weather -e \
            "SELECT installed_rank, version, description, success FROM flyway_schema_history ORDER BY installed_rank;"

          failed=$(mysql -h127.0.0.1 -uroot -proot agri_weather -N -B -e \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 0")
          test "$failed" = "0"

          crops=$(mysql -h127.0.0.1 -uroot -proot agri_weather -N -B -e \
            "SELECT COUNT(*) FROM crop_info")
          echo "crop rows: $crops"
          test "$crops" -ge 60

          missing=$(mysql -h127.0.0.1 -uroot -proot agri_weather -N -B -e \
            "SELECT COUNT(*) FROM crop_info WHERE data_source IS NULL OR confidence IS NULL")
          test "$missing" = "0"

          echo "---- crop confidence ----"
          mysql -h127.0.0.1 -uroot -proot agri_weather -e \
            "SELECT confidence, COUNT(*) AS crops FROM crop_info GROUP BY confidence ORDER BY confidence;"

      - name: Backend log on failure
        if: failure()
        run: tail -n 300 /tmp/backend.log || true

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-app-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: weather-app-react/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Strict TypeScript (all TS/TSX)
        run: npm run typecheck:strict
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run e2e
        env:
          CI: 'true'

  mcp:
    name: MCP self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
