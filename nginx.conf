# =============================================
# 智慧农业天气系统 — Nginx 配置
# =============================================
# 适用场景：前后端同机部署，Nginx 反代
#
# 获取免费 SSL 证书（有域名后）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名.com
#
# 配置文件位置：
#   有域名 → /etc/nginx/sites-available/agri-weather
#   无域名 → /etc/nginx/conf.d/default.conf（替换默认配置）
# =============================================

# ---------- HTTP 重定向到 HTTPS（有证书后取消注释）----------
# server {
#     listen 80;
#     server_name 你的域名.com;
#     return 301 https://$host$request_uri;
# }

# ---------- 后端负载均衡 ----------
# 后端已无状态（JWT + STATELESS），可直接多实例轮询，无需 sticky session
upstream agri_backend {
    least_conn;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8083 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# ---------- HTTPS 主配置（有证书后取消注释 server 行）----------
# 暂时用 HTTP + 80 端口，没有域名也能访问
server {
    listen 80;
    # listen 443 ssl http2;           # 有证书后取消注释
    server_name _;

    # SSL 证书（有域名后取消注释，路径 certbot 会自动配好）
    # ssl_certificate     /etc/letsencrypt/live/你的域名.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/你的域名.com/privkey.pem;

    # 前端静态文件根目录
    root /var/www/agri-weather;
    index index.html;

    # 社区图片上传：默认 1m 会让 5MB 图片在 Nginx 就被 413 拦掉
    client_max_body_size 8m;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ---------- 智能体：单独放宽超时 ----------
    # 对话可能串联多轮工具调用；图片识别还要等视觉模型推理，60s 不够用
    location /api/agent/ {
        proxy_pass http://agri_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;

        # SSE 流式轨迹：必须关闭代理缓冲，否则事件会被攒到最后
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://agri_backend;
        # keepalive 需要 1.1 + 清空 Connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ---------- PWA：Service Worker 与 index.html 不能缓存 ----------
    # 否则用户会长期停留在旧版本
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 前端 SPA 路由 ----------
    # 所有非文件请求回退到 index.html（支持前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
