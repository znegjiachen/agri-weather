# =============================================
# 智慧农业天气系统 — Nginx 配置
# =============================================
# 适用场景：前后端同机部署，Nginx 反代
#
# 获取免费 SSL 证书（有域名后）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d 你的域名.com
#
# 配置文件位置：
#   有域名 → /etc/nginx/sites-available/agri-weather
#   无域名 → /etc/nginx/conf.d/default.conf（替换默认配置）
# =============================================

# ---------- HTTP 重定向到 HTTPS（有证书后取消注释）----------
# server {
#     listen 80;
#     server_name 你的域名.com;
#     return 301 https://$host$request_uri;
# }

# ---------- HTTPS 主配置（有证书后取消注释 server 行）----------
# 暂时用 HTTP + 80 端口，没有域名也能访问
server {
    listen 80;
    # listen 443 ssl http2;           # 有证书后取消注释
    server_name _;

    # SSL 证书（有域名后取消注释，路径 certbot 会自动配好）
    # ssl_certificate     /etc/letsencrypt/live/你的域名.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/你的域名.com/privkey.pem;

    # 前端静态文件根目录
    root /var/www/agri-weather;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---------- 前端 SPA 路由 ----------
    # 所有非文件请求回退到 index.html（支持前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
