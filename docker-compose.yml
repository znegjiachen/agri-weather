# =============================================
# 智慧农业天气系统 — Docker Compose 一键部署
# =============================================
# 使用前：
#   1. 复制 .env.example 为 .env 并填写真实值
#   2. 构建前端: cd weather-app-react && npm run build
#
# 启动：docker-compose up -d
# 查看：docker-compose logs -f
# 停止：docker-compose down
# =============================================

version: '3.8'

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: agri-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: agri_weather
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # 数据持久化（容器删除后数据不丢）
      - mysql_data:/var/lib/mysql
      # 自动建表 + 初始数据
      - ./agri-weather-server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Spring Boot 后端 ====================
  backend:
    build:
      context: ./agri-weather-server
      dockerfile: Dockerfile
    container_name: agri-backend
    restart: always
    environment:
      DB_URL: jdbc:mysql://mysql:3306/agri_weather?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  # ==================== Nginx 前端 + 反代 ====================
  nginx:
    image: nginx:alpine
    container_name: agri-nginx
    restart: always
    volumes:
      # 前端静态文件
      - ./weather-app-react/dist:/usr/share/nginx/html:ro
      # Nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # - "443:443"    # 有证书后取消注释
    depends_on:
      - backend

volumes:
  mysql_data:
