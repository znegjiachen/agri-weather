# =============================================
# 问田 — Docker Compose 一键部署
# =============================================
# 使用前：
#   1. 复制 .env.example 为 .env 并填写真实值
#   2. 构建前端: cd weather-app-react && npm run build
#
# 启动：docker-compose up -d
# 查看：docker-compose logs -f
# 停止：docker-compose down
#
# 架构：mysql + redis + backend1 + backend2 + nginx
#   - 后端无状态（JWT + STATELESS），两实例由 nginx 轮询
#   - Redis 承担天气缓存与预取锁，两实例共享
# =============================================

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: agri-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: agri_weather
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # 数据持久化（容器删除后数据不丢）
      - mysql_data:/var/lib/mysql
      # 自动建表 + 初始数据
      - ./agri-weather-server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis（天气缓存） ====================
  redis:
    image: redis:7-alpine
    container_name: agri-redis
    restart: always
    # 缓存为主，内存满时淘汰带 TTL 的旧键
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== Spring Boot 后端（实例 1） ====================
  backend1:
    build:
      context: ./agri-weather-server
      dockerfile: Dockerfile
    container_name: agri-backend-1
    restart: always
    environment:
      INSTANCE_ID: node-1
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/agri_weather?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==================== Spring Boot 后端（实例 2） ====================
  backend2:
    build:
      context: ./agri-weather-server
      dockerfile: Dockerfile
    container_name: agri-backend-2
    restart: always
    environment:
      INSTANCE_ID: node-2
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/agri_weather?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==================== Nginx 前端 + 反代 ====================
  nginx:
    image: nginx:alpine
    container_name: agri-nginx
    restart: always
    volumes:
      # 前端静态文件
      - ./weather-app-react/dist:/usr/share/nginx/html:ro
      # Docker 专用配置：root 指向 /usr/share/nginx/html，upstream 指向 backend1/2
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # - "443:443"    # 有证书后取消注释
    depends_on:
      - backend1
      - backend2

volumes:
  mysql_data:
  redis_data:
