# =============================================
# Docker 环境专用 Nginx 配置
# =============================================
# 与根目录的 nginx.conf 区别：
#   1. 前端根目录是 /usr/share/nginx/html（compose 的挂载点）
#      —— 根目录 nginx.conf 写的 /var/www/agri-weather 在容器里并不存在
#   2. upstream 指向 docker 服务名 backend1 / backend2
# =============================================

upstream agri_backend {
    least_conn;
    server backend1:8082 max_fails=3 fail_timeout=15s;
    server backend2:8082 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 社区图片上传：默认 1m 会让 5MB 图片在 Nginx 就被 413 拦掉
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location = /api/agent/chat {
        proxy_pass http://agri_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://agri_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Service Worker 与入口页不缓存，静态资源长缓存
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
